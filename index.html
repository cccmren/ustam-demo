<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>USTAM ilova demosi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: desktop = presenter notes left + phone frame right; phone = app fills the screen. Single deliberate light look (app UI). */
:root{
  --bg:#E9EBE2; --paper:#F3F4EE; --card:#FFFFFF; --ink:#14170F; --muted:#666B5E; --line:#E0E3D7;
  --lime:#C8F031; --lime-ink:#1E2A00; --good:#25804A; --good-bg:#E4F3E8; --warn:#A8650C; --warn-bg:#FBF0DC;
  --map-land:#EEF0E6; --map-dist:#E3E7D6; --map-road:#FFFFFF; --map-river:#CFE3E8;
  --f-display:"Unbounded","Manrope",system-ui,sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
html,body{height:100%;margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.stage{min-height:100%;display:flex;gap:56px;align-items:center;justify-content:center;padding-block:32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.notes{max-width:340px;display:flex;flex-direction:column;gap:16px}
.brand{font-family:var(--f-display);font-weight:800;font-size:30px;letter-spacing:-.01em}
.brand span{background:var(--lime);padding:0 6px;border-radius:6px}
.notes p{margin:0;color:var(--muted)}
.notes ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.notes li b{color:var(--ink)}
.notes li{color:var(--muted)}
.notes h3{margin:0;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.tag{align-self:flex-start;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--warn);background:var(--warn-bg);padding:4px 8px;border-radius:6px}
.reset{align-self:flex-start;font-weight:700;border:1.5px solid var(--ink);padding:8px 14px;border-radius:10px}

.phone{width:390px;height:820px;max-height:calc(100vh - 64px);min-height:660px;background:var(--paper);border-radius:44px;border:10px solid var(--ink);overflow:hidden;position:relative;display:flex;flex-direction:column;box-shadow:0 30px 60px -30px rgba(20,23,15,.45)}
@media (max-width:820px){
  .notes{display:none}
  .stage{padding:0;display:block;height:100%}
  .phone{width:100%;height:100%;max-height:none;min-height:0;border:0;border-radius:0;box-shadow:none}
}

.top{padding:12px 18px 8px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;background:var(--paper)}
.logo{font-family:var(--f-display);font-weight:800;font-size:18px}
.logo i{font-style:normal;background:var(--lime);padding:0 4px;border-radius:4px}
.ttl{text-align:center;font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{height:38px;padding:0 12px 0 10px;border-radius:12px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;gap:4px;font-size:14px;font-weight:700}
.rolechip{display:flex;align-items:center;gap:6px;height:38px;padding:0 10px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-weight:800;font-size:13px}
.rolechip svg{opacity:.6}
.demo-badge{font-size:11px;font-weight:700;color:var(--warn);background:var(--warn-bg);padding:3px 8px;border-radius:20px;white-space:nowrap}

.screen{flex:1;overflow-y:auto;padding:4px 18px 110px;display:flex;flex-direction:column;gap:14px}
.screen>*{flex-shrink:0}
.phone.hastabs .screen{padding-bottom:170px}
.phone.big .screen,.phone.big .tabbar,.phone.big .cta{zoom:1.12}
.screen h1{font-family:var(--f-display);font-weight:600;font-size:21px;line-height:1.25;margin:4px 0 0;text-wrap:balance}
.screen h2{font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:6px 0 -4px}
.sub{color:var(--muted);margin:0}
.note{font-size:12.5px;color:var(--muted);margin:0}

.stepper{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:6px;margin-top:2px}
.stepper div{display:flex;flex-direction:column;gap:5px;font-size:11.5px;font-weight:700;color:var(--muted)}
.stepper i{display:block;height:4px;border-radius:4px;background:var(--line)}
.stepper .done i{background:var(--ink)}
.stepper .now i{background:var(--lime)}
.stepper .now{color:var(--ink)}

.searchwrap{position:relative}
.search{display:flex;align-items:center;gap:10px;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px}
.search:focus-within{border-color:var(--ink)}
.search input{border:0;outline:0;font:inherit;flex:1;min-width:0;background:transparent;color:var(--ink)}
.sugg{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 14px 30px -18px rgba(20,23,15,.5);z-index:4;overflow:hidden}
.sugg button{display:flex;justify-content:space-between;gap:10px;width:100%;padding:12px 14px;text-align:left;border-bottom:1px solid var(--line)}
.sugg button:last-child{border-bottom:0}
.sugg small{color:var(--muted)}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 10px;display:flex;flex-direction:column;gap:8px;text-align:left}
.cat .ic{width:34px;height:34px;border-radius:10px;background:var(--paper);display:grid;place-items:center}
.cat b{font-size:13px;line-height:1.2}
.cat small{color:var(--muted);font-size:12px}
.banner{display:flex;align-items:center;gap:12px;background:var(--lime);color:var(--lime-ink);border-radius:18px;padding:14px 16px;text-align:left;width:100%;font-weight:700}
.banner span{flex:1}
.banner small{display:block;font-weight:600;opacity:.8}
.hint{background:var(--ink);color:var(--paper);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:6px;text-align:left;width:100%}
.hint b{color:var(--lime)}
.hint small{color:#B9BEAD}
.again{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px}
.again small{color:var(--muted);display:block}
.pill{border:1.5px solid var(--ink);border-radius:12px;padding:8px 12px;font-weight:800;font-size:13px;white-space:nowrap}

.prod{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:6px}
.meta{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-size:12px;font-weight:700;padding:3px 8px;border-radius:20px;background:var(--paper);color:var(--muted);white-space:nowrap}
.chip.new{background:var(--lime);color:var(--lime-ink)}
.chip.ok{background:var(--good-bg);color:var(--good)}
.chip.wait{background:var(--warn-bg);color:var(--warn)}
.offers{display:flex;flex-direction:column;gap:10px}
.offer{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:14px;display:grid;grid-template-columns:20px 1fr auto;align-items:start;gap:4px 10px;text-align:left;width:100%}
.offer.sel{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.offer .radio{grid-row:span 2;margin-top:2px}
.offer .shop{font-weight:700}
.offer .price{font-weight:800;font-size:17px;text-align:right;white-space:nowrap}
.offer .info{color:var(--muted);font-size:13px}
.offer .diff{font-size:13px;text-align:right;color:var(--muted)}
.radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);display:inline-block;flex-shrink:0}
.offer.sel .radio,.opt.sel .radio{border:6px solid var(--ink)}
.best{font-size:11px;font-weight:800;color:var(--good);background:var(--good-bg);padding:2px 7px;border-radius:20px;margin-left:6px;vertical-align:2px;white-space:nowrap}
.qty{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px}
.step{display:flex;align-items:center;gap:12px}
.step button{width:38px;height:38px;border-radius:10px;background:var(--paper);font-size:20px;font-weight:700}
.step output{min-width:40px;text-align:center;font-weight:800;font-size:17px}
.step.sm{gap:8px}
.step.sm button{width:30px;height:30px;font-size:17px}
.step.sm output{min-width:28px;font-size:15px}
.quick{display:flex;gap:8px;flex-wrap:wrap}
.quick button{border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:7px 12px;font-weight:700;font-size:13px}
.quick button.sel{border-color:var(--ink);background:var(--lime)}

.group{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
button.group{text-align:left;width:100%}
.gh{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;font-weight:800}
.gh small{font-weight:600;color:var(--muted)}
.gh .chip{flex-shrink:0}
.line{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:14px;align-items:center}
.line small{color:var(--muted);font-size:12.5px}
.line .r{text-align:right;font-weight:700;white-space:nowrap}
.line .chip{justify-self:end}
.del{font-size:12.5px;color:var(--muted);text-decoration:underline;justify-self:end}
.truck{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.truck .row{display:flex;align-items:center;gap:12px}
.bar{height:8px;border-radius:8px;background:var(--paper);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);border-radius:8px;transition:width .4s}
.sum{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:8px}
.sum .l{display:flex;justify-content:space-between;gap:10px}
.sum .l span:first-child{color:var(--muted)}
.sum .l span:last-child{white-space:nowrap}
.sum .tot{border-top:1px dashed var(--line);padding-top:10px;font-weight:800;font-size:18px}
.save{background:var(--good-bg);color:var(--good);border-radius:14px;padding:12px 14px;font-weight:700;font-size:14px}
.empty{text-align:center;color:var(--muted);padding:30px 10px;display:flex;flex-direction:column;gap:12px;align-items:center}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.stat small{color:var(--muted);font-size:12px}
.stat b{font-size:18px}
.stat.dark{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.stat.dark small{color:#B9BEAD}
.stat.dark b{color:var(--lime)}
.price-in{display:flex;align-items:center;gap:6px}
.price-in input{width:108px;border:1.5px solid var(--line);border-radius:10px;padding:8px;font:inherit;font-weight:800;text-align:right;background:var(--paper);color:var(--ink)}
.row2{display:flex;gap:10px}
.row2>*{flex:1;min-width:0}
.btn2{border:1.5px solid var(--ink);border-radius:14px;padding:12px;font-weight:800;text-align:center;background:var(--card)}
.choice{display:flex;flex-direction:column;gap:10px}
.big{display:flex;flex-direction:column;gap:6px;background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:18px;text-align:left;width:100%}
.big.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.big.primary small{color:#B9BEAD}
.big b{font-size:17px}
.big small{color:var(--muted)}
.big .go{font-weight:800;color:var(--lime-ink);background:var(--lime);align-self:flex-start;padding:6px 12px;border-radius:10px;margin-top:6px;font-size:14px}

.picker{display:flex;flex-direction:column;gap:12px}
.pick{display:grid;grid-template-columns:48px 1fr 20px;gap:14px;align-items:center;background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:16px;text-align:left;width:100%}
.pick:hover{border-color:var(--ink)}
.pick .ic{width:48px;height:48px;border-radius:14px;background:var(--lime);color:var(--lime-ink);display:grid;place-items:center}
.pick b{display:block;font-size:17px}
.pick small{color:var(--muted);font-size:13.5px;line-height:1.35}
.langs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px}
.langs button{padding:8px 4px;border-radius:10px;font-weight:700;font-size:13px;color:var(--muted)}
.langs button[aria-pressed="true"]{background:var(--ink);color:var(--lime)}
.opts{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.opt{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);text-align:left;width:100%}
.opt:last-child{border-bottom:0}
.opt>span:not(.radio){flex:1}
.opt small{display:block;color:var(--muted)}

.pay{display:flex;flex-direction:column;gap:10px}
.pm{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:4px;text-align:left;width:100%}
.pm.sel{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.pm b{font-size:15px}
.pm small{color:var(--muted)}
.terms{display:flex;gap:8px;margin-top:8px}
.terms button{flex:1;border:1.5px solid var(--line);border-radius:12px;padding:8px 4px;font-weight:700;font-size:13px;background:var(--paper)}
.terms button.sel{border-color:var(--ink);background:var(--lime)}

.map{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.map svg{display:block;width:100%;height:auto;background:var(--map-land)}
.map .dist{fill:var(--map-dist);stroke:var(--card);stroke-width:2}
.map .dist.here{fill:#DDEFB0}
.map .dlabel{font:600 8.5px var(--f-body);fill:#8A9080;text-anchor:middle;letter-spacing:.02em}
.map .road{fill:none;stroke:var(--map-road);stroke-width:5;stroke-linecap:round}
.map .river{fill:none;stroke:var(--map-river);stroke-width:4}
.map .route-bg{fill:none;stroke:#9AA08F;stroke-width:3;stroke-dasharray:2 5;stroke-linecap:round}
.map .route{fill:none;stroke:var(--ink);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
.map .pin text{font:800 9px var(--f-body);fill:var(--ink);paint-order:stroke;stroke:var(--card);stroke-width:3px}
.map .pulse{fill:var(--lime);opacity:.5;transform-box:fill-box;transform-origin:center;animation:pulse 1.6s infinite}
@keyframes pulse{from{transform:scale(.6);opacity:.7}to{transform:scale(1.8);opacity:0}}
.mapinfo{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border-top:1px solid var(--line)}
.mapinfo b{display:block}
.mapinfo small{color:var(--muted)}
.eta{font-family:var(--f-display);font-weight:600;font-size:18px;white-space:nowrap}
.replay{font-size:12.5px;font-weight:700;text-decoration:underline;color:var(--muted)}
.drv{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.drv .who{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center}
.ava{width:48px;height:48px;border-radius:50%;background:var(--ink);color:var(--lime);display:grid;place-items:center;font-weight:800;font-size:16px}
.ava.lg{width:96px;height:96px;font-size:30px}
.drv b{display:block}
.drv small{color:var(--muted)}
.plate{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:800;font-size:13px;border:2px solid var(--ink);border-radius:6px;padding:2px 6px;white-space:nowrap;background:var(--card)}
.drvfacts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.drvfacts div{background:var(--paper);border-radius:12px;padding:8px 10px}
.drvfacts small{display:block;font-size:11.5px}
.drvfacts b{font-size:13.5px}
.callrow{display:flex;gap:10px}
.callrow button{display:flex;align-items:center;justify-content:center;gap:8px}
.callrow .primary{background:var(--ink);color:var(--lime);border-color:var(--ink)}
.sheet{position:absolute;inset:0;background:var(--paper);z-index:8;display:flex;flex-direction:column}
.sheet[hidden]{display:none}
.call{background:var(--ink);color:var(--paper);align-items:center;justify-content:space-between;padding:56px 24px calc(40px + env(safe-area-inset-bottom,0px));text-align:center}
.call .ava{background:var(--lime);color:var(--lime-ink)}
.call h3{font-family:var(--f-display);font-weight:600;font-size:22px;margin:16px 0 4px}
.call small{color:#B9BEAD}
.call .timer{font-family:var(--f-display);font-size:18px;color:var(--lime);margin-top:14px}
.callbtns{display:flex;gap:22px;justify-content:center}
.callbtns button{width:64px;height:64px;border-radius:50%;background:#2A2F22;color:var(--paper);display:grid;place-items:center}
.callbtns button.on{background:var(--paper);color:var(--ink)}
.callbtns .end{background:#D2452F;color:#fff}
.callbtns label{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:#B9BEAD}
.chathead{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line);background:var(--card)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--paper);border-radius:12px;padding:4px;margin:10px 18px 0}
.seg button{padding:7px;border-radius:9px;font-weight:700;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--lime)}
.msgs{flex:1;overflow-y:auto;padding:14px 18px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:80%;padding:10px 12px;border-radius:16px;font-size:14px;line-height:1.4}
.msg.them{background:var(--card);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px}
.msg.me{background:var(--ink);color:var(--paper);align-self:flex-end;border-bottom-right-radius:4px}
.msg small{display:block;font-size:11px;opacity:.6;margin-top:3px}
.typing{align-self:flex-start;color:var(--muted);font-size:13px}
.qr{display:flex;gap:8px;overflow-x:auto;padding:0 18px 8px}
.qr button{flex-shrink:0;border:1.5px solid var(--line);background:var(--card);border-radius:16px;padding:7px 12px;font-weight:700;font-size:13px}
.compose{display:flex;gap:8px;padding:8px 18px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--card)}
.compose input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;font:inherit;background:var(--paper);color:var(--ink)}
.compose button{background:var(--ink);color:var(--lime);border-radius:14px;padding:0 14px;font-weight:800}
.callrow button{flex:1;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:11px;font-weight:800;font-size:14px}

.track{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.st{display:grid;grid-template-columns:28px 1fr;gap:12px;padding-bottom:16px;position:relative}
.st:last-child{padding-bottom:0}
.st::before{content:"";position:absolute;left:13px;top:28px;bottom:2px;width:2px;background:var(--line)}
.st:last-child::before{display:none}
.st .dot{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:var(--card);display:grid;place-items:center;font-size:13px;font-weight:800;z-index:1}
.st.done .dot{background:var(--ink);border-color:var(--ink);color:var(--lime)}
.st.now .dot{border-color:var(--ink);background:var(--lime)}
.st.done::before{background:var(--ink)}
.st b{display:block}
.st small{color:var(--muted)}
.ok{display:flex;align-items:center;gap:12px;background:var(--lime);color:var(--lime-ink);border-radius:18px;padding:16px;font-weight:800}

.cta{position:absolute;left:0;right:0;bottom:0;padding:12px 18px calc(16px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--paper) 70%,rgba(243,244,238,0));z-index:3}
.cta:empty{display:none}
.phone.hastabs .cta{bottom:calc(62px + env(safe-area-inset-bottom,0px));padding-bottom:10px}
.cta button{width:100%;background:var(--ink);color:var(--paper);border-radius:16px;padding:16px;font-weight:800;font-size:16px;display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left}
.cta button em{font-style:normal;color:var(--lime);white-space:nowrap}
.tabbar{position:absolute;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(var(--n),1fr);background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:4}
.tabbar:empty{display:none}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:12px;font-size:11.5px;font-weight:700;color:var(--muted);position:relative}
.tabbar button[aria-current="page"]{color:var(--ink)}
.tabbar button[aria-current="page"] .ti{background:var(--lime)}
.tabbar .ti{width:44px;height:28px;border-radius:14px;display:grid;place-items:center}
.tabbar sup{position:absolute;top:2px;left:calc(50% + 8px);background:var(--ink);color:var(--lime);font-size:10.5px;font-weight:800;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
.toast{position:absolute;left:18px;right:18px;bottom:96px;background:var(--ink);color:var(--paper);padding:12px 14px;border-radius:14px;font-weight:700;font-size:14px;opacity:0;transform:translateY(8px);transition:.25s;pointer-events:none;z-index:6}
.phone.hastabs .toast{bottom:150px}
.toast.on{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

function toCyr(str){
  return str.replace(/USTAM|Uzcard|Humo|Baza 7|Tosh-Material|M400|https?:\S+/g, m=>"\u0000"+encodeURIComponent(m)+"\u0001")
   .split(/(\u0000[^\u0001]*\u0001)/).map(part=>{
    if(part.startsWith("\u0000")) return decodeURIComponent(part.slice(1,-1)).replace("M400","М400");
    let s=part.replace(/[‘’ʻʼ`]/g,"'");
    s=s.replace(/(^|[^A-Za-z'])([Ee])/g,(m,a,e)=>a+(e==="E"?"Э":"э"));
    L2C.forEach(([a,b])=>{ s=s.split(a).join(b); });
    return s.replace(/[A-Za-z']/g,ch=>{ const lo=ch.toLowerCase(), c=L1[lo]; if(!c) return ch; return ch===lo?c:c.toUpperCase(); });
  }).join("");
}

function districtAt(x,y){
  for(let k=0;k<polys.length;k++){ const pg=polys[k]; let ins=false;
    for(let i=0,j=pg.length-1;i<pg.length;j=i++){ const [xi,yi]=pg[i],[xj,yj]=pg[j];

function startMap(stops, totalMin, onStage, opts={}){
  stopMap();
  const path=document.getElementById("route"); if(!path) return;
  const L=path.getTotalLength(), cum=[0];
  for(let i=1;i<stops.length;i++) cum.push(cum[i-1]+Math.abs(stops[i].x-stops[i-1].x)+Math.abs(stops[i].y-stops[i-1].y));
  path.style.strokeDasharray=L; path.style.strokeDashoffset=L;
  const dur=opts.dur||16000, wait=1300;
  let t0=null, paused=0, nextStop=1, holdUntil=0, last=-2;
  const truck=document.getElementById("truckdot"), where=$("mwhere"), state=$("mstate"), eta=$("meta"), distEls=[...document.querySelectorAll(".map .dist")];
  MAP={raf:0};
  function frame(ts){
    if(t0===null) t0=ts;
    if(ts<holdUntil){ MAP.raf=requestAnimationFrame(frame); return; }
    let len=Math.min(L, L*(ts-t0-paused)/dur);
    if(nextStop<stops.length && len>=cum[nextStop]){
      len=cum[nextStop]; const i=nextStop; nextStop++; const st=stops[i];
      state.textContent = st.kind==="dest" ? t("mArr") : t("mLoading", st.label);
      if(st.kind!=="dest"){ holdUntil=ts+wait; paused+=wait; }
      if(onStage) onStage(i);
    } else if(len<L){
      const nx=stops[Math.min(nextStop,stops.length-1)];
      state.textContent = nx.kind==="dest" ? t(opts.destKey||"mToObj") : t("mTo", nx.label);
    }
    const pt=path.getPointAtLength(len);
    truck.setAttribute("transform",`translate(${pt.x},${pt.y})`);
    path.style.strokeDashoffset=L-len;
    const k=districtAt(pt.x,pt.y);
    if(k!==last){ last=k; where.textContent = t("now", k<0?t("tash"):t("district",N(DISTRICTS[k][0]))); distEls.forEach((e,j)=>e.classList.toggle("here",j===k)); }
    eta.textContent = len>=L ? t("arrived") : t("min", Math.max(1,Math.round(totalMin*(1-len/L))));
    if(len<L) MAP.raf=requestAnimationFrame(frame);
  }
  MAP.raf=requestAnimationFrame(frame);
  $("mreplay").onclick=()=>{ startMap(stops,totalMin,onStage,opts); if(opts.onReplay) opts.onReplay(); };
}

function tabBar(){
  const bar=$("tabbar"), ph=$("phone");
  let tabs=null, cur=null;
  if(ROLE==="usta"||ROLE==="uy"){
    const b=B(); cur = b.view==="shop"?"home":b.view;
    if(["home","shop","cart","orders","settings","objects"].includes(b.view))
      tabs = ROLE==="usta" ? [["home","home","tHome"],["cart","cart","tCart",b.cart.length],["objects","folder","tObj"],["orders","list","tOrders"],["settings","gear","tSet"]]
                           : [["home","home","tHome"],["cart","cart","tCart",b.cart.length],["orders","list","tOrders"],["settings","gear","tSet"]];
  } else if(ROLE==="dokon"){
    cur=D.view; const fresh=D.orders.filter(o=>o.st==="new").length;
    if(["orders","catalog","settings"].includes(D.view)) tabs=[["orders","list","tOrders",fresh],["catalog","box","tCatalog"],["settings","gear","tSet"]];
  }
  if(!tabs){ bar.innerHTML=""; ph.classList.remove("hastabs"); return; }
  ph.classList.add("hastabs"); bar.style.setProperty("--n",tabs.length);
  bar.innerHTML = tabs.map(([v,ic,k,badge])=>`<button data-nav="${v}" ${cur===v?'aria-current="page"':""}><span class="ti">${ICONS[ic]}</span>${t(k)}${badge?`<sup>${badge}</sup>`:""}</button>`).join("");
}
function trackSteps(steps, cur){
  return `<div class="track">${steps.map((s,i)=>`<div class="st ${i<cur?"done":i===cur?"now":""}"><span class="dot">${i<cur?"&#10003;":i+1}</span><div><b>${s[0]}</b><small>${s[1]}</small></div></div>`).join("")}</div>`;
}

/* ================= Ekranlar ================= */
function render(){
  stopMap(); closeSheet(); renderNotes();
  $("phone").classList.toggle("big", BIG);
  $("screen").scrollTop=0; $("cta").innerHTML="";
  if(!ROLE) renderPicker();
  else if(B().view==="settings" && ROLE!=="dokon" || ROLE==="dokon" && D.view==="settings") renderSettings();
  else if(ROLE==="usta" && (S.view==="objects"||S.view==="object")) renderObjects();
  else if(ROLE==="usta") renderBuy(S, {cat:"home", hi:"hiUsta", dest:"objLbl", destKey:"mToObj"});
  else if(ROLE==="uy") renderUy();
  else renderDokon();
  tabBar();
}

/* ----- Xarid oqimi (usta va uy egasi) ----- */
function renderBuy(b, cfg){
  const sc=$("screen"), cta=$("cta"), v=b.view;
  if(v===cfg.cat){
    topBar(cfg.back||null, cfg.title||t("tHome"));
    const sp=P("sement"), ck=cheapest(sp);
    const live = b.cur && !b.cur.done;
    sc.innerHTML = `
      ${live?`<button class="banner" data-open="${b.cur.id}">${ICONS.truck}<span>${t("onWay",b.cur.id)}<small>${t("onWaySub")}</small></span>&#8594;</button>`:""}
      <h1>${t(cfg.hi)}</h1>${cfg.intro?`<p class="sub">${t(cfg.intro)}</p>`:""}
      <div class="searchwrap"><label class="search">${ICONS.search}<input id="q" placeholder="${t("search")}" autocomplete="off" value="${QUERY.replace(/"/g,"&quot;")}"></label><div id="sugg"></div></div>
      ${ROLE==="usta"?`<button class="again" data-nav="objects" style="text-align:left;width:100%"><div><small>${t("whichObj")}</small><b>${N(curObj().short)}</b></div><span class="pill">${t("tObj")} &#8594;</span></button><div class="again"><div><b>${t("again")}</b><small>${t("againSub")}</small></div><button class="pill" data-repeat="1032">${t("againBtn")}</button></div>`:""}
      <h2>${t("cats")}</h2>
      <div class="cats">${PRODUCTS.map(p=>`<button class="cat" data-prod="${p.id}"><span class="ic">${ICONS[p.icon]}</span><b>${N(p.cat)}</b><small class="num">${t("from",fmt(Math.min(...Object.values(p.prices))))}</small></button>`).join("")}</div>
      <button class="hint" data-prod="sement"><span>${t("cheapToday")}</span><b class="num">${t("perBag",so(sp.prices[ck]))}</b><small>${t("cmp3",N(SHOPS[ck].name),N(SHOPS[ck].area))}</small></button>`;
    if(b.cart.length) cta.innerHTML = `<button data-nav="cart"><span>${t("tCart")} · ${b.cart.length}</span><em class="num">${so(goods(b.cart))}</em></button>`;
    const q=$("q");
    const showSugg=()=>{ QUERY=q.value; const val=q.value.trim().toLowerCase(); const box=$("sugg");
      if(!val){ box.innerHTML=""; return; }
      const hits=PRODUCTS.filter(x=>[x.name.uz,x.name.ru,x.cat.uz,x.cat.ru,toCyr(x.name.uz)].join(" ").toLowerCase().includes(val));
      box.innerHTML = `<div class="sugg">${hits.length?hits.map(x=>`<button data-prod="${x.id}"><span>${N(x.name)}</span><small class="num">${t("from",so(Math.min(...Object.values(x.prices))))}</small></button>`).join(""):`<button disabled><small>${t("notFound")}</small></button>`}</div>`; };
    q.addEventListener("input",showSugg);
    q.addEventListener("keydown",e=>{ if(e.key==="Enter"){ const f=document.querySelector(".sugg [data-prod]"); if(f) openProd(f.dataset.prod); }});
    if(QUERY) showSugg();
    return;
  }
  if(v==="prod"){
    const p=P(b.pid), best=cheapest(p);
    topBar(cfg.cat, t("s1"));
    const offers=Object.entries(p.prices).sort((x,y)=>x[1]-y[1]);
    sc.innerHTML = `${stepper(BUY,0)}
      <div class="prod"><h1 style="margin:0">${N(p.name)}</h1><div class="meta"><span class="chip">${N(p.pack)}</span><span class="chip">${t("shops",offers.length)}</span></div></div>
      <h2>${t("whichShop")}</h2>
      <div class="offers">${offers.map(([k,val])=>{const d=val-p.prices[best];return `
        <button class="offer ${b.shop===k?"sel":""}" data-shop="${k}" aria-pressed="${b.shop===k}">
          <span class="radio"></span>
          <span class="shop">${N(SHOPS[k].name)}${k===best?`<span class="best">${t("cheapest")}</span>`:""}</span>
          <span class="price num">${so(val)}</span>
          <span class="info">${N(SHOPS[k].area)} · ${t("km",String(SHOPS[k].km).replace(".",","))} · ${t("stock",fmt(p.stock[k])+" "+unit(p))}</span>
          <span class="diff num">${d?t("dearer",fmt(d)):t("unitPrice",unit(p))}</span>
        </button>`}).join("")}</div>
      <h2>${t("howMany")}</h2>
      <div class="qty"><span><b>${t("qty")}</b> <small class="sub">(${unit(p)})</small></span>
        <div class="step"><button data-q="-1" aria-label="−">−</button><output class="num">${fmt(b.qty)}</output><button data-q="1" aria-label="+">+</button></div></div>
      <div class="quick">${p.quick.map(n=>`<button class="${b.qty===n?"sel":""}" data-setqty="${n}">${fmt(n)} ${unit(p)}</button>`).join("")}</div>
      ${cfg.calc&&NORM[p.id]?calcBox(p,b):""}
      <p class="sub num">${t("weightNote",fmt(p.kg*b.qty))}</p>`;
    cta.innerHTML = `<button id="add"><span>${t("add")}</span><em class="num">${so(p.prices[b.shop]*b.qty)}</em></button>`;
    $("add").onclick=()=>{ const ex=b.cart.find(i=>i.pid===p.id&&i.shop===b.shop); if(ex) ex.qty+=b.qty; else b.cart.push({pid:p.id,shop:b.shop,qty:b.qty}); toast(t("added",N(p.name),fmt(b.qty))); b.view=cfg.cat; QUERY=""; render(); };
    return;
  }
  if(v==="cart"){
    topBar(null, t("tCart"));
    if(!b.cart.length){ sc.innerHTML=`<div class="empty">${ICONS.cart}<b>${t("cartEmpty")}</b><button class="btn2" data-nav="${cfg.cat}">${t("pickMat")}</button></div>`; return; }
    sc.innerHTML = stepper(BUY,1) + `<h1>${t("cartT")}</h1><p class="sub">${t("cartSub",shopsIn(b.cart).length,b.cart.length)}</p>` + cartBody(b.cart,true) + (ROLE==="usta"?objPicker():"") + `<button class="btn2" data-nav="${cfg.cat}">${t("moreMat")}</button>`;
    cta.innerHTML = `<button data-nav="pay"><span>${t("toPay")}</span><em class="num">${so(goods(b.cart)+delivery(b.cart).total)}</em></button>`;
    return;
  }
  if(v==="pay"){
    topBar("cart", t("s3"));
    const total=goods(b.cart)+delivery(b.cart).total;
    sc.innerHTML = stepper(BUY,2) + payBody(b.pay,b.term,total);
    cta.innerHTML = `<button id="place"><span>${t("confirm")}</span><em class="num">${so(total)}</em></button>`;
    $("place").onclick=()=>{ placeOrder(b, b.cart, cfg.dest, cfg.destKey); b.cart=[]; b.view="track"; render(); };
    return;
  }
  if(v==="track"){
    topBar(cfg.cat, t("s4"));
    trackScreen(b.cur, stepper(BUY,3));
    cta.innerHTML = `<button data-nav="${cfg.cat}"><span>${t("tHome")}</span><em>&#8594;</em></button>`;
  }
  if(v==="orders"){
    topBar(null, t("tOrders"));
    sc.innerHTML = `<h1>${t("ordersT")}</h1>` + (b.orders.length? b.orders.slice().reverse().map(o=>`
      <div class="group"><div class="gh"><span>№${o.id}${o.past?` · ${N(o.date)}`:""}</span><span class="chip ${o.done?"ok":"wait"}">${t(o.done?"stDelivered":"stWay")}</span></div>
        <div class="line"><span>${o.cart.map(i=>N(P(i.pid).name)+" × "+fmt(i.qty)).join(", ")}</span><span class="r num">${so(goods(o.cart))}</span></div>
        <div class="row2">${o.past?"":`<button class="btn2" data-open="${o.id}">${t("where")}</button>`}<button class="btn2" data-repeat="${o.id}">${t("repeat")}</button></div></div>`).join("") : `<div class="empty">${t("noOrders")}</div>`);
  }
}

const curObj = () => S.objects.find(o=>o.id===S.objCur) || S.objects[0];
const objSpent = ob => ob.hist.reduce((s,h)=>s+goods(h.cart)+delivery(h.cart).total,0);
const objSaved = ob => ob.hist.reduce((s,h)=>s+dearTotal(h.cart)-goods(h.cart),0);
const mlnF = n => (n/1e6).toFixed(1).replace(".",",");
function objPicker(){
  return `<h2>${t("whichObj")}</h2><div class="quick">${S.objects.map(o=>`<button class="${S.objCur===o.id?"sel":""}" data-objpick="${o.id}">${N(o.short)}</button>`).join("")}</div>
    <p class="note">${t("toObjT",N(curObj().short))}</p>`;
}
function renderObjects(){
  const sc=$("screen"), cta=$("cta");
  if(S.view==="objects"){
    topBar(null, t("tObj"));
    sc.innerHTML = `<h1>${t("objT")}</h1><p class="sub">${t("objSub")}</p>` + S.objects.map(o=>{
      const sp=objSpent(o), pc=Math.min(100,Math.round(sp/o.budget*100));
      return `<button class="group" data-obj="${o.id}"><div class="gh"><span>${N(o.name)}</span>${S.objCur===o.id?`<span class="chip new">${t("active")}</span>`:""}</div>
        <small class="sub">${t("client",N(o.client))} · ${t("stage",N(o.stage))}</small>
        <div class="bar"><i style="width:${pc}%"></i></div>
        <div class="line"><small class="num">${t("used",pc)}</small><b class="r num">${t("spentOf",t("mlnV",mlnF(sp)),t("mlnV",mlnF(o.budget)))}</b></div></button>`}).join("") +
      (S.newObj ? `<div class="group"><b>${t("newObj").replace("+ ","")}</b>
        <label class="search" style="padding:10px 12px"><input id="nobName" placeholder="${t("objNamePh")}" aria-label="${t("objName")}"></label>
        <div class="row2"><label class="search" style="padding:10px 12px"><input id="nobClient" placeholder="${t("objClient")}"></label><label class="search" style="padding:10px 12px"><input id="nobBudget" type="number" inputmode="decimal" placeholder="${t("objBudget")}"></label></div>
        <div class="row2"><button class="btn2" id="nobCancel">${t("cancel")}</button><button class="btn2" id="nobAdd" style="background:var(--lime)">${t("create")}</button></div></div>`
       : `<button class="btn2" id="nobOpen">${t("newObj")}</button>`);
    if(S.newObj){
      $("nobCancel").onclick=()=>{ S.newObj=false; render(); };
      $("nobAdd").onclick=()=>{ const nm=$("nobName").value.trim()||t("objNamePh").replace(/^[^:]*:\s*/,""); const cl=$("nobClient").value.trim()||"-"; const bd=(+$("nobBudget").value||10)*1e6;
        const id="o"+(S.objects.length+1); S.objects.push({id, name:{uz:nm,ru:nm}, short:{uz:nm,ru:nm}, client:{uz:cl,ru:cl}, budget:bd, stage:{uz:"boshlanish",ru:"начало"}, x:150, y:200, hist:[]});
        S.objCur=id; S.newObj=false; toast(t("created")); render(); };
    } else $("nobOpen").onclick=()=>{ S.newObj=true; render(); };
    return;
  }
  const o=S.objects.find(x=>x.id===S.objSel); const sp=objSpent(o), pc=Math.min(100,Math.round(sp/o.budget*100));
  topBar("objects", t("objT"));
  const agg={}; o.hist.forEach(h=>h.cart.forEach(i=>{ agg[i.pid]=agg[i.pid]||{qty:0,sum:0}; agg[i.pid].qty+=i.qty; agg[i.pid].sum+=P(i.pid).prices[i.shop]*i.qty; }));
  sc.innerHTML = `<h1>${N(o.name)}</h1><p class="sub">${t("client",N(o.client))} · ${t("stage",N(o.stage))}</p>
    <div class="group"><div class="line"><span>${t("budget")}</span><b class="r num">${t("spentOf",t("mlnV",mlnF(sp)),t("mlnV",mlnF(o.budget)))}</b></div><div class="bar"><i style="width:${pc}%"></i></div><small class="sub">${t("used",pc)}</small></div>
    <div class="stats"><div class="stat dark"><small>${t("buys")}</small><b class="num">${o.hist.length}</b></div><div class="stat"><small>${t("savedObj")}</small><b class="num">${so(objSaved(o))}</b></div></div>
    <h2>${t("mats")}</h2>
    <div class="group">${Object.keys(agg).length?Object.entries(agg).map(([pid,a])=>`<div class="line"><span>${N(P(pid).name)} × ${fmt(a.qty)} ${unit(P(pid))}</span><span class="r num">${so(a.sum)}</span></div>`).join(""):`<small class="sub">${t("noBuys")}</small>`}</div>
    <h2>${t("hist")}</h2>
    ${o.hist.slice().reverse().map((h,ix)=>`<div class="group"><div class="gh"><span>${N(h.d)}${h.id?` · №${h.id}`:""}</span><b class="num">${so(goods(h.cart)+delivery(h.cart).total)}</b></div>
      <small class="sub">${h.cart.map(i=>N(P(i.pid).name)+" × "+fmt(i.qty)).join(", ")}</small>
      <button class="del" style="justify-self:start" data-objrep="${o.hist.length-1-ix}">${t("repeatCart")}</button></div>`).join("")}
    <button class="btn2" id="rep">${t("report")}</button>`;
  $("rep").onclick=()=>toast(t("reportT",N(o.client)));
  cta.innerHTML = `<button id="forobj"><span>${t("forObj")}</span><em>&#8594;</em></button>`;
  $("forobj").onclick=()=>{ S.objCur=o.id; S.view="home"; render(); };
}

function calcBox(p, b){
  const need=Math.max(1, Math.ceil(b.area*NORM[p.id]/p.kg));
  return `<div class="group"><div class="gh"><span>${t("calcT")}</span><small>${t("calcS")}</small></div>
    <div class="line"><span>${t("area")}</span><label class="price-in"><input type="number" inputmode="numeric" id="area" value="${b.area}" min="1" step="1"><small>m²</small></label></div>
    <div class="line"><span>${t("approx")}</span><b class="r num">${need} ${unit(p)}</b><small>${t("calcNote")}</small><button class="del" data-setqty="${need}">${t("takeThis")}</button></div></div>`;
}

function cartBody(c, editable){
  const dl=delivery(c), w=weight(c), g=goods(c), save=dearTotal(c)-g;
  const groups=shopsIn(c).map(k=>{const items=c.map((it,ix)=>({...it,ix})).filter(i=>i.shop===k);
    return `<div class="group"><div class="gh"><span>${N(SHOPS[k].name)}</span><small>${N(SHOPS[k].area)}</small></div>
    ${items.map(i=>{const p=P(i.pid), lo=Math.min(...Object.values(p.prices)), hi=Math.max(...Object.values(p.prices));
      if(editable) return `<div class="line"><span>${N(p.name)}<br><small class="num">${so(p.prices[k])} · ${t("kgv",fmt(p.kg*i.qty))}</small></span><b class="r num">${so(p.prices[k]*i.qty)}</b>
        <div class="step sm"><button data-lq="${i.ix}:-1" aria-label="−">−</button><output class="num">${fmt(i.qty)}</output><button data-lq="${i.ix}:1" aria-label="+">+</button></div><button class="del" data-del="${i.ix}">${t("remove")}</button></div>`;
      return `<div class="line"><span>${N(p.name)} × ${fmt(i.qty)}</span><span class="r num">${so(p.prices[k]*i.qty)}</span>
        <small class="num">${t("unitLine",unit(p),fmt(p.prices[k]),fmt(lo),fmt(hi))}</small>${p.prices[k]===lo?`<span class="chip ok">${t("cheapest")}</span>`:"<span></span>"}</div>`}).join("")}</div>`}).join("");
  return `${groups}
    <div class="truck"><div class="row">${ICONS.truck}<div><b>${t("oneTruck")}</b><br><small class="sub">${N(dl.car)}</small></div></div>
      <div class="bar"><i style="width:${Math.min(100,w/dl.cap*100)}%"></i></div>
      <small class="sub num">${t("load",fmt(w),fmt(dl.cap))}</small></div>
    <div class="sum">
      <div class="l"><span>${t("goods")}</span><span class="num">${so(g)}</span></div>

const CHATS={};
function openChat(id, who){
  closeSheet(); const sh=$("sheet"); sh.hidden=false;
  const key=id+who; if(!CHATS[key]) CHATS[key]=[{me:false, k: who==="d"?"d0":"o0", a:[id]}];
  const qs = who==="d" ? [["dq1","da1"],["dq2","da2"],["dq3","da3"],["dq4","da4"]] : [["oq1","oa1"],["oq2","oa2"],["oq3","oa3"]];
  const draw=(typing)=>{
    sh.innerHTML = `<div class="chathead"><button class="back" id="chback">&#8592; ${t("back")}</button><div style="display:flex;gap:10px;align-items:center">
        <span class="ava" style="width:38px;height:38px;font-size:13px">${who==="d"?"RK":"M"}</span><div><b>${who==="d"?t("drvName"):t("opName")}</b><small class="sub" style="display:block;font-size:12px">${who==="d"?PLATE:""} ${t("online")}</small></div></div></div>

      <div class="msgs" id="msgs">${CHATS[key].map(m=>`<div class="msg ${m.me?"me":"them"}">${m.txt!==undefined?m.txt.replace(/</g,"&lt;"):t(m.k,...(m.a||[]))}</div>`).join("")}${typing?`<div class="typing">${who==="d"?t("drvName"):"Malika"} ${t("typing")}</div>`:""}</div>
      <div class="qr">${qs.map(([q,a])=>`<button data-q2="${q}|${a}">${t(q)}</button>`).join("")}</div>
      <form class="compose" id="cform"><input id="cin" placeholder="${t("msgPh")}" autocomplete="off" aria-label="${t("msgPh")}"><button type="submit">${t("send")}</button></form>`;
    const m=$("msgs"); m.scrollTop=m.scrollHeight;
    $("chback").onclick=closeSheet;
    sh.querySelectorAll("[data-q2]").forEach(b=>b.onclick=()=>{ const [q,a]=b.dataset.q2.split("|"); say({me:true,k:q}, {me:false,k:a,a:a==="da1"?[(()=>{ const m=$("meta")?$("meta").textContent:""; const d=(m.match(/\d+/)||["5"])[0]; return d; })()]:[]}); });
    $("cform").onsubmit=e=>{ e.preventDefault(); const v=$("cin").value.trim(); if(!v) return; say({me:true,txt:v},{me:false,k:"aDef"}); };
  };
  const say=(mine, reply)=>{ CHATS[key].push(mine); draw(true); setTimeout(()=>{ if($("sheet").hidden) { CHATS[key].push(reply); return; } CHATS[key].push(reply); draw(false); },1100); };
  draw(false);
}

function placeOrder(b, cart, destK, destKey){
  const o={id:NEXT_ID++, cart:cart.map(i=>({...i})), done:false, destK, destKey};
  if(ROLE==="usta"){ const ob=curObj(); o.obj=ob.id; o.x=ob.x; o.y=ob.y; o.destLabel=N(ob.short); ob.hist.push({d:{uz:"Bugun",ru:"Сегодня"}, cart:cart.map(i=>({...i})), id:o.id}); }
  b.orders.push(o); b.cur=o;
  const mine=cart.filter(i=>i.shop==="b");
  if(mine.length) D.orders.unshift({id:o.id, who:ROLE==="uy"?"wUyYou":"wUstaYou", where:ROLE==="uy"?"pYunH":"pYunO", time:"nowT", items:mine.map(i=>({pid:i.pid,qty:i.qty})), st:"new"});
  return o;
}

function trackScreen(o, head){
  const c=o.cart, shops=shopsIn(c);
  const stops=[{x:262,y:120,label:t("truckLbl"),kind:"start"}]
    .concat(shops.map(k=>({x:SHOPS[k].x,y:SHOPS[k].y,label:N(SHOPS[k].name),kind:"shop"})))
    .concat([{x:o.x||DEST.x,y:o.y||DEST.y,label:o.destLabel||t(o.destK),kind:"dest"}]);
  const steps=[[t("st0"),t("st0s")]]
    .concat(shops.map(k=>[t("stShop",N(SHOPS[k].name)), `${N(SHOPS[k].area)} · ${c.filter(i=>i.shop===k).map(i=>N(P(i.pid).name)+" × "+fmt(i.qty)).join(", ")}`]))
    .concat([[t("stRoad"),N(delivery(c).car)+" · "+t("driver")],[t("stDone"),t("stDoneS")]]);
  $("screen").innerHTML = (head||"") + `<h1 id="trk">${t(o.done?"trackDone":"trackT",o.id)}</h1><p class="sub">${t("trackSub")}</p>${mapHTML(stops)}
    ${driverCard(c, o.id)}<div id="steps"></div><div id="okbox"></div>`;
  let cur=1;
  const draw=()=>{ $("steps").innerHTML=trackSteps(steps,cur); $("okbox").innerHTML = cur>=steps.length?`<div class="ok">${ICONS.truck}<span>${t("doneBox")}</span></div>`:""; };
  draw();
  startMap(stops,55,i=>{ if(stops[i].kind==="dest"){ cur=steps.length; o.done=true; const h=$("trk"); if(h) h.textContent=t("trackDone",o.id); } else cur=i+1; draw(); },
    {destKey:o.destKey, dur:17000, onReplay:()=>{cur=1;draw();}});
}

document.addEventListener("input",e=>{ const el=e.target; if(el.dataset && el.dataset.price && D.draft) D.draft[el.dataset.price]=+el.value; });

document.addEventListener("click",e=>{

  if(cc){ if(cc.dataset.call) openCall(cc.dataset.call); else { const [id,w]=cc.dataset.chat.split(":"); openChat(id,w); } return; }
  if(e.target.closest("#sheet")) return;
  const el=e.target.closest("[data-obj],[data-objpick],[data-objrep],[data-lang],[data-big],[data-switch],[data-role],[data-nav],[data-open],[data-repeat],[data-prod],[data-shop],[data-q],[data-setqty],[data-lq],[data-del],[data-pay],[data-term],[data-order],[data-demo]"); if(!el) return;
  const ds=el.dataset;
  if(ds.lang){ setLang(ds.lang); render(); return; }
  if(ds.big){ BIG=ds.big==="1"; try{ localStorage.setItem("ustam-big",BIG?"1":"0"); }catch(_){} render(); return; }
  if(ds.switch){ ROLE=null; render(); return; }
  if(ds.role){ const was=ROLE; ROLE=ds.role; if(was && was!==ROLE){ const b=ROLE==="dokon"?D:B(); if(b.view==="settings") b.view= ROLE==="dokon"?"orders":"home"; } render(); return; }
  if(ds.demo){ toast(t("demoAct")); return; }
  if(ds.term){ e.stopPropagation(); if(ROLE==="uy"&&U.view==="lpay") U.lterm=+ds.term; else B().term=+ds.term; render(); return; }
  if(ds.nav){ if(ROLE==="dokon") D.view=ds.nav; else B().view=ds.nav; render(); return; }
  if(ds.open){ const b=B(), o=b.orders.find(x=>String(x.id)===ds.open); if(o){ b.cur=o; b.view = ROLE==="uy" && o.destKey==="mToHome" && !U.orders.includes(o)?"track":"track"; render(); } return; }
  if(ds.repeat){ const b=B(), o=b.orders.find(x=>String(x.id)===ds.repeat); if(o){ o.cart.forEach(i=>{ const ex=b.cart.find(x=>x.pid===i.pid&&x.shop===i.shop); if(ex) ex.qty+=i.qty; else b.cart.push({...i}); }); toast(t("repeated")); b.view="cart"; render(); } return; }
  if(ds.obj){ S.objSel=ds.obj; S.view="object"; render(); return; }
  if(ds.objpick){ S.objCur=ds.objpick; render(); return; }
  if(ds.objrep){ const h=S.objects.find(x=>x.id===S.objSel).hist[+ds.objrep]; S.objCur=S.objSel; h.cart.forEach(i=>{ const ex=S.cart.find(x=>x.pid===i.pid&&x.shop===i.shop); if(ex) ex.qty+=i.qty; else S.cart.push({...i}); }); toast(t("repeated")); S.view="cart"; render(); return; }
  if(ds.prod){ openProd(ds.prod); return; }
  if(ds.order){ D.sel=+ds.order; D.view="order"; render(); return; }
  const b=B();
  if(ds.shop){ b.shop=ds.shop; render(); }
  else if(ds.q){ const p=P(b.pid), step=p.id==="gisht"?100:1; b.qty=Math.max(step,b.qty+(+ds.q)*step); render(); }
  else if(ds.setqty){ b.qty=+ds.setqty; render(); }
  else if(ds.lq){ const [ix,dlt]=ds.lq.split(":").map(Number), it=b.cart[ix], step=it.pid==="gisht"?100:1; it.qty=Math.max(step,it.qty+dlt*step); render(); }
  else if(ds.del){ b.cart.splice(+ds.del,1); render(); }
  else if(ds.pay){ if(ROLE==="uy"&&U.view==="lpay") U.lpay=ds.pay; else b.pay=ds.pay; render(); }
});
setLang(LANG);
render();
</script>
